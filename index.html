<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>World Projection · ARC Studios / Emre Arıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#02050b; --glass:rgba(9,15,28,.78); --line:rgba(150,190,255,.14); --txt:#eef3ff; --mut:#93a4c2; --acc:#5cf2d6; --gold:#ffd166;
  --fd:"Unbounded","Manrope","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif; --fu:"Manrope","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif; --fm:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--fu);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px}
h1,h2,h3{font-family:var(--fd);margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
#top{position:fixed;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
#leftcol{display:flex;flex-direction:column;gap:8px;max-width:52%}
#brand{padding:10px 14px;pointer-events:auto}
#brand h1{font-size:16px;font-weight:600;letter-spacing:-.01em} #brand h1 b{font-weight:600;background:linear-gradient(90deg,#5cf2d6,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
#brand small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
#legend{padding:8px 10px;font-size:11px;color:var(--mut);width:170px;max-width:100%;pointer-events:auto}
#legend .bar{height:8px;border-radius:4px;margin:6px 0 3px}
#legend .ticks{display:flex;justify-content:space-between}
#legend .sw{display:flex;align-items:center;gap:6px;margin-top:3px}
#legend .sw i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
#hud{padding:10px 12px;display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:12px;pointer-events:auto;min-width:172px}
#hud span{color:var(--mut)} #hud b{text-align:right;font-family:var(--fm);font-weight:700;font-size:12px}
#hud .yr{grid-column:1/3;font-size:26px;text-align:center;font-family:var(--fd);font-weight:600;color:var(--gold);line-height:1;margin-bottom:2px}
#hud .th{grid-column:1/3;text-align:center;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
#panel{position:fixed;left:12px;right:12px;bottom:12px;padding:12px;z-index:5;max-width:560px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px} .row:last-child{margin-bottom:0}
select{flex:1;min-width:0;background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:14px;appearance:none}
select option,select optgroup{background:#0c1424}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;min-width:48px;flex:none}
input[type=range]{flex:1;accent-color:var(--acc);height:28px}
.yv{font-family:var(--fd);font-weight:600;font-size:17px;color:var(--gold);min-width:46px;text-align:right}
.seg{display:flex;flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:12px;color:var(--mut)}
.seg button.on{background:rgba(92,242,214,.16);color:var(--acc);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:7px 11px;font-size:12px;color:var(--mut);white-space:nowrap}
.chip.on{border-color:rgba(92,242,214,.6);color:var(--txt);background:rgba(92,242,214,.14)}
.cta{width:100%;border:0;border-radius:14px;padding:13px;font-weight:600;font-family:var(--fd);font-size:13px;letter-spacing:.02em;background:linear-gradient(90deg,#5cf2d6,#7aa8ff);color:#04101c}
.iconbtn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
#collapse{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:46px;height:22px;border-radius:11px;border:1px solid var(--line);background:#0c1424;font-size:12px;color:var(--mut)}
#panel.min .hideable{display:none}
#modal{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;z-index:30;background:rgba(1,3,8,.45)}
#modal.show{display:flex}
#card{width:100%;max-width:580px;margin:12px;max-height:84vh;overflow:auto;padding:16px 18px 18px}
#card h2{font-size:21px}
#card .sub{color:var(--mut);font-size:12px;margin:4px 0 10px}
#card p{font-size:14px;line-height:1.55;margin:8px 0;color:#d6e2f7}
#card .tabs{margin:6px -2px 8px}
.cyr{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.cyr button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:rgba(255,255,255,.03)}
.kpi span{display:block;font-size:11px;color:var(--mut)}
.kpi b{font-family:var(--fu);font-size:17px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi i{font-style:normal;font-size:12px;margin-left:4px}
.up{color:#ff8a65}.down{color:#7ee8c7}.neu{color:var(--mut)}.good{color:#7ee8c7}.bad{color:#ff8a65}
.phase{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,209,102,.12);color:var(--gold);border:1px solid rgba(255,209,102,.3)}
.ms{list-style:none;padding:0;margin:8px 0}
.ms li{display:flex;gap:8px;font-size:13px;line-height:1.5;padding:5px 0;border-bottom:1px dashed rgba(140,190,255,.12);color:#c9d7ee}
.ms li b{font-family:var(--fm);min-width:42px;color:var(--mut)}
.ms li.done b{color:var(--acc)} .ms li.next{opacity:.7}
.ms small{color:var(--mut);font-size:10px;margin-left:4px}
.rbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0 4px}
.rleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--mut)}
.rleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.btns{display:flex;gap:8px;margin-top:14px} .btns button{flex:1}
.ghost{border:1px solid var(--line);background:transparent;border-radius:14px;padding:12px;font-weight:600}
.note{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.5}
#card a{color:var(--acc)}
#card p.yeartxt{background:rgba(255,209,102,.07);border-left:3px solid var(--gold);padding:8px 10px;border-radius:8px}
#card ul.src{padding-left:18px;margin:6px 0;font-size:13px;line-height:1.6;color:#c9d7ee}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);padding:10px 16px;font-size:13px;z-index:6;display:none;pointer-events:none}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:30;transition:opacity .6s}
#loader div{font-family:var(--fd);color:var(--mut);letter-spacing:2px;font-size:13px}
#modeBtn:disabled{opacity:.4}
#dayBtn{display:none} body.citymode #dayBtn{display:grid}
#cityTag{position:fixed;z-index:4;pointer-events:none;padding:7px 10px;font-size:11px;line-height:1.45;transform:translate(-50%,calc(-100% - 14px));display:none;white-space:nowrap;border-radius:12px}
#cityTag b{font-family:var(--fd);font-weight:600;font-size:12px;color:var(--gold)}
#cityTag .h{color:#ff9b6b}#cityTag .p{color:#7ee8c7}
body.citymode #cityTag{display:none!important}
#cityNote{position:fixed;left:50%;transform:translateX(-50%);bottom:4px;font-size:10px;color:rgba(160,180,210,.7);z-index:4;display:none;text-align:center;width:90%;pointer-events:none}
body.citymode #cityNote{display:block}
@media (max-width:899px){ body.citymode #panel .row:not(:last-child){display:none} body.citymode #panel .row:nth-child(4){display:flex} }
@media (max-width:899px){ body.citymode #legend{display:none} }
body.citymode #panel{bottom:22px}
#tag{position:fixed;right:14px;bottom:4px;font-size:9px;color:rgba(142,163,196,.5);z-index:4;pointer-events:none}
@media (max-width:899px){#brand .long{display:none}#brand h1{font-size:15px}#legend{width:150px}}
@media (min-width:900px){ #panel{left:auto;right:16px;bottom:16px;width:420px;margin:0} #modal{align-items:center} }

#brand .brow{display:flex;gap:6px;margin-top:6px;align-items:center}
#brand select#selLang{flex:none;padding:4px 8px;font-size:12px;border-radius:9px;width:auto;max-width:140px}
#brand .cred{color:var(--gold);font-weight:600;letter-spacing:.3px}
#sndBtn{width:30px;height:28px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:14px;padding:0}
.credit{margin:14px 0 6px;padding:16px;border-radius:16px;text-align:center;background:linear-gradient(135deg,rgba(92,242,214,.10),rgba(255,209,102,.10));border:1px solid rgba(255,209,102,.35)}
.credit .cr-name{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.5px}
.credit .cr-by{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:2px;margin-top:8px}
.credit .cr-arc{font-family:var(--fd);font-weight:700;font-size:26px;letter-spacing:4px;color:var(--gold);margin-top:2px}
.credit .cr-who{font-family:var(--fd);font-size:17px;font-weight:600}
.credit .cr-tag{font-size:11px;color:var(--mut);margin:4px 0 6px}
.credit a{color:var(--acc);font-size:12px}
/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px 18px calc(24px + env(safe-area-inset-bottom));text-align:center;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 110%,#0c3a4a 0%,#06142a 45%,#02040a 100%);transition:opacity 1.1s ease, visibility 1.1s}
#splash.out{opacity:0;visibility:hidden}
#splash canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#splash > *:not(canvas){position:relative;z-index:1}
#splash .sp-kicker{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:var(--mut);opacity:0;animation:spIn 1.2s .3s forwards}
#splash .sp-title{font-family:var(--fd);font-weight:700;font-size:clamp(34px,9vw,76px);letter-spacing:-1px;line-height:1;margin:10px 0 4px;opacity:0;animation:spIn 1.4s .7s forwards}
#splash .sp-title b{background:linear-gradient(90deg,#5cf2d6,#ffd166 60%,#ff8c5a);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .sp-years{font-family:var(--fd);font-size:clamp(22px,5.5vw,40px);font-weight:600;color:var(--gold);letter-spacing:2px;opacity:0;animation:spIn 1.2s 1.2s forwards}
#splash .sp-tag{max-width:520px;color:#c6d4ec;font-size:14px;line-height:1.5;margin:10px 0 0;opacity:0;animation:spIn 1.2s 1.5s forwards}
#splash .sp-credit{margin:26px 0 0;padding:14px 26px;border-radius:18px;border:1px solid rgba(255,209,102,.4);background:rgba(255,209,102,.06);opacity:0;animation:spIn 1.4s 1.9s forwards}
#splash .sp-credit .by{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--mut)}
#splash .sp-credit .arc{font-family:var(--fd);font-weight:700;font-size:clamp(26px,6vw,38px);letter-spacing:6px;color:var(--gold);text-shadow:0 0 24px rgba(255,209,102,.45)}
#splash .sp-credit .who{font-family:var(--fd);font-size:clamp(17px,4.2vw,22px);font-weight:600;margin-top:2px}
#splash .sp-credit .st{font-size:11px;color:var(--mut);margin-top:3px}
#splash .sp-langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:22px 0 0;opacity:0;animation:spIn 1s 2.3s forwards}
#splash .sp-langs button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px}
#splash .sp-langs button.on{background:rgba(92,242,214,.18);border-color:var(--acc);color:#fff}
#splash .sp-go{margin-top:18px;background:linear-gradient(90deg,#5cf2d6,#7fd3ff);color:#03131a;border:0;border-radius:999px;padding:14px 34px;font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.5px;box-shadow:0 0 30px rgba(92,242,214,.35);opacity:0;animation:spIn 1s 2.6s forwards}
#splash .sp-go:disabled{filter:grayscale(.7) brightness(.7)}
#splash .sp-hint{font-size:11px;color:var(--mut);margin-top:10px;opacity:0;animation:spIn 1s 2.9s forwards}
@keyframes spIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-height:640px){ #splash .sp-credit{margin-top:14px;padding:10px 18px} #splash .sp-langs{margin-top:12px} #splash .sp-tag{display:none} }
/* ---------- layer button (panel) ---------- */
.layerbtn{width:100%;display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-radius:14px;padding:8px 12px 8px 9px;text-align:left}
.layerbtn .orb{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 30%,var(--pc2,#fff) 0,var(--pc,#5cf2d6) 46%,#0a1020 100%);box-shadow:0 0 16px -2px var(--pc,#5cf2d6)}
.layerbtn .lt{display:flex;flex-direction:column;line-height:1.15;flex:none}
.layerbtn small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.layerbtn b{font-family:var(--fd);font-weight:600;font-size:14px}
.layerbtn .lh{flex:1;font-size:11px;color:var(--mut);text-align:right;line-height:1.3}
.layerbtn em{font-style:normal;color:var(--mut);font-size:20px;margin-left:2px}
/* ---------- orbit overlay ---------- */
#orbit{position:fixed;inset:0;z-index:3;pointer-events:none}
#orbitSvg{position:absolute;inset:0}
#orbitEl{fill:none;stroke:rgba(160,200,255,.18);stroke-width:1;stroke-dasharray:2 6}
.pl{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border:0;background:transparent;border-radius:50%;pointer-events:auto;padding:0;will-change:transform}
.pl span{position:absolute;left:50%;top:calc(100% - 6px);transform:translateX(-50%);white-space:nowrap;font-size:clamp(10.5px,.8vw,12.5px);font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:rgba(6,11,22,.72);border:1px solid rgba(150,190,255,.18);color:#dfe8fb;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:all .25s}
.pl.on span{background:var(--pc);color:#07101d;border-color:transparent;box-shadow:0 0 18px -2px var(--pc)}
.pl:hover span{border-color:var(--pc)}
.pl.back span{opacity:.75}
body.citymode #orbit{display:none}
/* ---------- layer page ---------- */
#page{position:fixed;inset:0;z-index:25;display:none;background:radial-gradient(120% 70% at 50% -10%,color-mix(in srgb,var(--pc,#5cf2d6) 22%,transparent) 0,transparent 60%),rgba(2,5,11,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden}
#page.show{display:flex;flex-direction:column;animation:pgIn .35s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pg-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 18px 24px}
.pg-in{max-width:880px;margin:0 auto}
.pg-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 6px;max-width:916px;margin:0 auto;width:100%}
.pg-top button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.pg-top .pg-brand{font-family:var(--fd);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--mut)}
.pg-top .pg-brand b{color:var(--txt);font-weight:600}
.pg-hero{display:flex;align-items:center;gap:18px;padding:14px 0 16px}
.pg-orb{width:86px;height:86px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,var(--pc2) 0,var(--pc) 44%,#060a16 100%);box-shadow:0 0 50px -6px var(--pc),inset -10px -14px 30px rgba(0,0,0,.5);position:relative}
.pg-orb:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid color-mix(in srgb,var(--pc) 45%,transparent)}
.pg-kicker{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pc);font-weight:800}
.pg-hero h1{font-size:clamp(26px,6.4vw,44px);line-height:1.05;margin:6px 0 6px;font-weight:600}
.pg-hero p{margin:0;color:#b9c7e0;font-size:14px;line-height:1.45}
.pg-layers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 14px}
.pg-layers button{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--mut);min-width:0}
.pg-layers button i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--c2) 0,var(--c) 50%,#0a1020 100%)}
.pg-layers button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.pg-layers button.on{border-color:var(--c);color:var(--txt);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pg-ctrl{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:18px;padding:12px;margin-bottom:16px}
.pg-ctrl .row{margin-bottom:8px}
.pg-place h2{font-size:clamp(20px,4.6vw,28px);font-weight:600}
.pg-place .sub{color:var(--mut);font-size:12.5px;margin:6px 0 10px}
#page p{font-size:15px;line-height:1.62;margin:10px 0;color:#d5e0f5}
#page p.yeartxt{background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 12%,transparent),transparent);border-left:3px solid var(--pc);padding:12px 14px;border-radius:10px;font-size:15.5px;color:#eef3ff}
#page .kpis{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
#page .kpi{padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.035)}
#page .kpi span{font-size:11.5px;font-weight:600;letter-spacing:.01em;margin-bottom:4px}
#page .kpi b{font-size:19px}
#page .sub{color:var(--mut);font-size:12px}
#page .note{font-size:11.5px}
#page .phase{font-size:11px;font-weight:700}
.pg-foot{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(4,8,16,.9);max-width:916px;margin:0 auto;width:100%}
.pg-foot .nav{flex:none;width:52px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;font-size:20px}
.pg-foot .cta{background:linear-gradient(90deg,var(--pc),var(--pc2));}
@media (min-width:900px){ .pg-hero{padding:22px 0 22px} .pg-orb{width:110px;height:110px} .pg-layers button{font-size:11px} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">

<script>// World Projection — splash screen + procedural Web Audio soundtrack (no audio files, no licensing)
(() => {
  const I = window.I18N, LANGS = ['tr','en','de','ru','zh','es'];
  const $ = id => document.getElementById(id);
  const sp = $('splash');
  let lang = (() => { try { const q=new URLSearchParams(location.search).get('lang') || localStorage.getItem('wp25_lang'); if (LANGS.includes(q)) return q; } catch(e){}
    const n=(navigator.language||'tr').slice(0,2).toLowerCase(); return LANGS.includes(n) ? n : 'en'; })();
  let ready = false;

  function texts(){
    const U = I[lang].f.ui;
    $('spKicker').textContent = U.presents;
    $('spTag').textContent = U.tagline;
    $('spBy').textContent = U.madeBy;
    $('spSt').textContent = U.studioTag;
    $('spGo').textContent = ready ? U.start : U.loading;
    $('spHint').textContent = U.soundHint;
    $('spLangs').innerHTML = LANGS.map(l=>`<button data-l="${l}" class="${l===lang?'on':''}">${I[l].flag} ${I[l].name}</button>`).join('');
    $('spLangs').querySelectorAll('button').forEach(b => b.onclick = e => { e.stopPropagation(); pickLang(b.dataset.l); startMusic(); });
  }
  function pickLang(l){ lang = l; try { localStorage.setItem('wp25_lang', l); } catch(e){} if (window.setLang) window.setLang(l); texts(); }
  window.__splashLang = () => { try { const l = localStorage.getItem('wp25_lang'); if (l && l!==lang){ lang=l; texts(); } } catch(e){} };
  window.__appReady = () => { ready = true; $('spGo').disabled = false; texts(); };
  texts();

  /* ---------- year counter ---------- */
  { const el=$('spYear'), t0=performance.now()+1600, dur=3000;
    const iv=setInterval(()=>{ const k=Math.min(1, Math.max(0,(performance.now()-t0)/dur)), e=1-Math.pow(1-k,3);
      el.textContent = 2026 + Math.round(24*e); if (k>=1) clearInterval(iv); }, 50); }

  /* ---------- background: rotating dotted globe + stars (2D canvas) ---------- */
  const cv = $('spCanvas'), cx = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio||1, 2);
  let W=0, H=0; const fit = () => { W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR; }; fit(); addEventListener('resize', fit);
  const stars = Array.from({length:180}, () => [Math.random(), Math.random(), Math.random()]);
  const pts = []; for (let i=0;i<900;i++){ const z=1-2*(i+.5)/900, r=Math.sqrt(1-z*z), a=i*2.399963; pts.push([Math.cos(a)*r, z, Math.sin(a)*r]); }
  let alive = true, t0 = performance.now();
  (function draw(now){
    if (!alive) return;
    const t = (now - t0)/1000;
    cx.clearRect(0,0,W,H);
    for (const [x,y,b] of stars){ cx.fillStyle = `rgba(190,215,255,${0.25+0.5*b*(0.6+0.4*Math.sin(t*1.5+b*20))})`; cx.fillRect(x*W, y*H, DPR*1.2, DPR*1.2); }
    const R = Math.min(W,H)*0.42, ox = W/2, oy = H*0.5, rot = t*0.18, warm = Math.min(1, t/9);
    for (const [x,y,z] of pts){
      const xr = x*Math.cos(rot) - z*Math.sin(rot), zr = x*Math.sin(rot) + z*Math.cos(rot);
      if (zr < -0.05) continue;
      const k = 0.35 + 0.65*zr, lat = Math.abs(y);
      const r = Math.round(92 + (255-92)*warm*(1-lat)), g = Math.round(242 - 90*warm*(1-lat)), bl = Math.round(214 - 150*warm*(1-lat));
      cx.fillStyle = `rgba(${r},${g},${bl},${0.10 + 0.32*k})`;
      cx.beginPath(); cx.arc(ox + xr*R, oy - y*R, DPR*(0.7+1.3*k), 0, 6.283); cx.fill();
    }
    const gr = cx.createRadialGradient(ox, oy, R*0.95, ox, oy, R*1.25); gr.addColorStop(0,'rgba(92,242,214,0.10)'); gr.addColorStop(1,'rgba(92,242,214,0)');
    cx.fillStyle = gr; cx.beginPath(); cx.arc(ox, oy, R*1.25, 0, 6.283); cx.fill();
    requestAnimationFrame(draw);
  })(t0);

  /* ---------- procedural cinematic soundtrack ---------- */
  let ac = null, master = null, musicOn = false, muted = false;
  try { muted = localStorage.getItem('wp25_mute') === '1'; } catch(e){}
  const BPM = 84, BEAT = 60/BPM, BAR = BEAT*4;
  // A minor: Am – F – C – G   (MIDI roots, chord tones)
  const PROG = [[57,[57,60,64,69]],[53,[53,57,60,65]],[48,[52,55,60,64]],[55,[55,59,62,67]]];
  const hz = m => 440*Math.pow(2,(m-69)/12);

  function buildGraph(){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp).connect(ac.destination);
    // reverb from generated impulse
    const len = ac.sampleRate*3.2, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c=0;c<2;c++){ const d=ir.getChannelData(c); for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
    const rev = ac.createConvolver(); rev.buffer = ir; const revG = ac.createGain(); revG.gain.value = 0.55; rev.connect(revG).connect(master);
    // ping-pong-ish delay for arps
    const dl = ac.createDelay(2); dl.delayTime.value = BEAT*0.75; const fb = ac.createGain(); fb.gain.value = 0.38; const dlG = ac.createGain(); dlG.gain.value = 0.35;
    dl.connect(fb).connect(dl); dl.connect(dlG).connect(master); dlG.connect(rev);
    return { rev, dl };
  }
  let FX = null, nextBar = 0, barIdx = 0, sched = null;

  function voice(dest, type, f, t, dur, peak, att, rel, cutoff, detune=0){
    const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
    o.type = type; o.frequency.value = f; o.detune.value = detune;
    fl.type = 'lowpass'; fl.frequency.value = cutoff; fl.Q.value = 0.6;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t+att); g.gain.setValueAtTime(peak, t+Math.max(att, dur-rel)); g.gain.linearRampToValueAtTime(0, t+dur);
    o.connect(fl).connect(g); dest.forEach(d=>g.connect(d));
    o.start(t); o.stop(t+dur+0.05);
    return fl;
  }
  function pad(t, chord){
    chord.forEach((m,i) => {
      [-7, 7].forEach(dt => { const fl = voice([master, FX.rev], 'sawtooth', hz(m), t, BAR*1.15, 0.022, 1.4, 1.6, 900, dt);
        fl.frequency.setValueAtTime(500, t); fl.frequency.linearRampToValueAtTime(1500 + i*150, t+BAR*0.6); fl.frequency.linearRampToValueAtTime(700, t+BAR*1.15); });
    });
  }
  function bass(t, root){ voice([master], 'sine', hz(root-12), t, BAR*0.98, 0.16, 0.08, 0.6, 400); voice([master], 'triangle', hz(root-24), t, BAR*0.98, 0.06, 0.08, 0.6, 200); }
  function arp(t, chord, bar){
    const seq = [0,1,2,3,2,1,2,3]; if (bar < 2) return;   // arps enter on bar 3
    seq.forEach((s,i) => { const m = chord[s] + 12 + (i===7 && bar%2 ? 12 : 0);
      voice([master, FX.dl, FX.rev], 'triangle', hz(m), t + i*BEAT/2, BEAT*0.5, 0.05, 0.005, 0.32, 3200); });
  }
  function pulse(t, bar){ if (bar < 4) return; for (let i=0;i<4;i++){ // soft heartbeat kick
    const o=ac.createOscillator(), g=ac.createGain(); const tt=t+i*BEAT; o.frequency.setValueAtTime(110,tt); o.frequency.exponentialRampToValueAtTime(42,tt+0.18);
    g.gain.setValueAtTime(i%2?0.10:0.22,tt); g.gain.exponentialRampToValueAtTime(0.001,tt+0.35); o.connect(g).connect(master); o.start(tt); o.stop(tt+0.4); } }
  function riser(t){
    const n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate*3, ac.sampleRate), d=b.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    n.buffer = b; const f = ac.createBiquadFilter(); f.type='bandpass'; f.Q.value = 4; f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(5000,t+2.6);
    const g = ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12,t+2.5); g.gain.linearRampToValueAtTime(0,t+2.9);
    n.connect(f).connect(g); g.connect(master); g.connect(FX.rev); n.start(t); n.stop(t+3);
  }
  function impact(t){
    const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(30,t+1.6);
    g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+2.2); o.connect(g); g.connect(master); g.connect(FX.rev); o.start(t); o.stop(t+2.3);
    voice([master, FX.rev], 'sine', hz(81), t, 3.5, 0.05, 0.01, 3, 4000); voice([master, FX.rev], 'sine', hz(88), t, 3.5, 0.035, 0.01, 3, 4000);
  }
  function tick(){
    while (nextBar < ac.currentTime + 0.4){
      const [root, chord] = PROG[barIdx % 4];
      pad(nextBar, chord); bass(nextBar, root); arp(nextBar, chord, barIdx); pulse(nextBar, barIdx);
      nextBar += BAR; barIdx++;
    }
  }
  function setVol(v, sec=1.5){ if (!master) return; const t=ac.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(muted?0:v, t+sec); }
  let level = 0.9;
  function startMusic(){
    if (musicOn) { if (ac && ac.state==='suspended') ac.resume(); return; }
    try {
      FX = buildGraph(); musicOn = true; ac.resume && ac.resume();
      const t = ac.currentTime + 0.05;
      riser(t); impact(t + 2.6); nextBar = t + 2.6; barIdx = 0;
      tick(); sched = setInterval(tick, 120);
      setVol(level, 0.6);
      $('spHint').style.visibility = 'hidden';
      sndBtn.textContent = muted ? '🔇' : '🔊';
    } catch(e){ console.warn('audio', e); }
  }
  const sndBtn = $('sndBtn');
  sndBtn.textContent = '🔇';
  sndBtn.onclick = () => { if (!musicOn){ muted=false; startMusic(); return; } muted = !muted; try{ localStorage.setItem('wp25_mute', muted?'1':'0'); }catch(e){} sndBtn.textContent = muted ? '🔇' : '🔊'; setVol(level, 0.4); };
  sp.addEventListener('pointerdown', () => startMusic(), { once:false });
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });

  $('spGo').onclick = e => {
    e.stopPropagation(); if (!ready) return;
    startMusic(); level = 0.32; setTimeout(()=>setVol(level, 3), 1200);   // keep a soft ambient bed under the app
    sp.classList.add('out'); setTimeout(()=>{ alive=false; sp.remove(); }, 1200);
  };
})();
</script>

  let hour = dayMode==='day' ? 13.5 : dayMode==='golden' ? 17.3 : dayMode==='night' ? 22.5 : (15.5 + (now - cityT0)/1000/240*24) % 24;
  const elevDeg = Math.sin((hour-6)/12*Math.PI) * 58, az = (hour/24)*Math.PI*2 + 0.6;
  const el = elevDeg*Math.PI/180;
  const sunDir = new THREE.Vector3(Math.cos(el)*Math.sin(az), Math.sin(el), Math.cos(el)*Math.cos(az));
  sky.sunPosition.value.copy(sunDir); envSky.sunPosition.value.copy(sunDir);
  const turb = 2 + A.smog*7 + A.heat*2.5, mie = 0.004 + A.smog*0.02;
  sky.turbidity.value = envSky.turbidity.value = turb; sky.mieCoefficient.value = envSky.mieCoefficient.value = mie;
  sky.rayleigh.value = envSky.rayleigh.value = 1.2 + A.heat*0.8 + A.smog*0.6;
  const night = Math.min(1, Math.max(0, (4 - elevDeg)/10));
  uNight.value = night;
  const lightDir = elevDeg > -2 ? sunDir : new THREE.Vector3(-sunDir.x, 0.6, -sunDir.z).normalize();   // moon
  sunL.position.copy(cityControls.target).addScaledVector(lightDir, 150); sunL.target.position.copy(cityControls.target);
  const warmSun = new THREE.Color().setHSL(0.08 + Math.min(1,Math.max(0,elevDeg/40))*0.05, 0.8 - Math.min(1,Math.max(0,elevDeg/50))*0.6, 0.6);
  sunL.color.copy(night>0.5 ? new THREE.Color(0x8fa6d6) : warmSun);
  sunL.intensity = night>0.5 ? 0.25 : Math.max(0.35, Math.sin(Math.max(0,el))*2.4) * (1 - A.smog*0.35) * (1 - A.cloud*0.35);
  hemiL.intensity = (isMobile?0.25:0.1) + (1-night)*(isMobile?0.7:0.3);
  renderer.toneMappingExposure = 0.62 - (1-night)*0.2;
  const fogC = new THREE.Color().setRGB(0.50+A.heat*0.10+A.smog*0.05, 0.55-A.smog*0.05, 0.62-A.heat*0.14-A.smog*0.10).multiplyScalar(1 - night*0.88);
  cityScene.fog.color.copy(fogC); cityScene.fog.near = 140 - A.smog*50; cityScene.fog.far = 1500 - A.smog*650 - A.heat*200;
  uHaze.value = A.heat * Math.max(0, Math.sin(Math.max(0,el))) * (state.theme==='iklim'?1.3:1);
  uCamT.value.copy(cityControls.target);
  if (cityBloom){ cityBloom.strength.value = 0.12 + night*0.5; cityBloom.threshold.value = 1.4 - night*0.8; }
  if (!isMobile && (envDirty || now-lastEnv > 2500)){ cubeCam.update(renderer, envScene); envDirty=false; lastEnv=now; }
}

      if (city){ k += kpi(K.coastRisk, lvl(city.r), city.r>0?`<i class="up">${K.seaPlus(cm(g.Sea))}</i>`:''); k += kpi(K.heatRisk, lvl(city.h));
        if (sub) k += kpi(K.subsidence, K.yes, `<i class="up">${K.subsNote}</i>`);

    if (city){
      if (CP){ const c0=cpAt(2026), cy=cpAt(y), ch=(cy/c0-1)*100;
        k += kpi(K.cityPopUN2(cn), fmtMil(cy/1000), `<i class="${ch>=0?'up':'down'}">${ch>=0?'+':''}${fx(ch,1)}%</i>`);
        const rank = Object.keys(CPOP).map(n=>[n, cityPop(n,y)]).sort((a,b)=>b[1]-a[1]).findIndex(a=>a[0]===city.n)+1;
        k += kpi(K.among43, K.rankN(rank));
        if (cd) k += kpi(K.shareOf(cname), F.pct(fx(cy/popAt(cd.p,y)/10,1)));
        k += kpi(K.y2050(sN), fmtMil(cityPop(city.n,2050)/1000));
        [5000,10000,15000,20000,25000,30000,40000,50000].forEach(th=>{ const yy=firstYear(q=>cpAt(q)>=th && cpAt(2026)<th); if (yy) loc.push({y:yy, t:M.cityExceeds(cn, th/1000), src:'UN WUP 2025', loc:1}); });
        if (CP[1]<CP[0]) loc.push({y:2050, t:M.cityDecline(cn, fx(CP[0]/1000,1), fx(CP[1]/1000,1)), src:'UN WUP 2025', loc:1});
      } else { k += kpi(K.cityPop(cn), K.notInUN5); }
    }
    if (cd){
      const p0=popAt(cd.p,2026), p=popAt(cd.p,y), ch=(p/p0-1)*100;
      k += kpi(K.ctyPop(cname), fmtPop(p), `<i class="${ch>=0?'up':'down'}">${ch>=0?'+':''}${fx(ch,1)}%</i>`);
      k += kpi(K.trend, popAt(cd.p,2050)>popAt(cd.p,2026)? K.growing : K.shrinking);
      k += kpi(K.worldShare, F.pct(fx(p/(g.P*1000)*100,2)));
      k += kpi(K.y2050(sN), fmtPop(popAt(cd.p,2050)));
      txt += city ? `${cityLine()}<p>${cname}: ${ctyN(key)}</p>` : `<p>${ctyN(key)}</p>`;
      if (Math.abs(cd.p[1]/cd.p[0]-1) >= .05){ const tgt = cd.p[1]>cd.p[0]? 1.1:0.95; const yy=firstYear(q=>tgt>1? popAt(cd.p,q)>=cd.p[0]*tgt : popAt(cd.p,q)<=cd.p[0]*tgt);
        if (yy) loc.push({y:yy, t: tgt>1? M.ctyUp10(cname) : M.ctyDown5(cname), src:'UN WPP 2024', loc:1}); }
      loc.push({y:2050, t:M.ctyPop2050(cname, fmtPop(popAt(cd.p,2050)), sN), src:'UN WPP 2024 + SSP', loc:1});
    } else if (P.has){
      k += kpi(cname, K.noPopData);
      txt += `<p>${Sx.noPop(cname)}</p>` + cityLine();
    }
    if (!P.has || !cd){ k += kpi(K.worldPop, fmtBn(g.P), dlt(g0.P,g.P,' '+U.bn,2)); }
    glob = F.g.nufus({P:fx(g.P,2), L:fx(g.L,1), U:Math.round(g.U)});
    loc.push(...worldMS('nufus'));
  }

  if (theme==='ekonomi'){
    const gd = cd ? gdpAt(cd.g,y) : null;
    if (gd){
      const gv0=gdpAt(cd.g,2026), pop=popAt(cd.p,y), pc=gd/pop*1000, pc0=gv0/popAt(cd.p,2026)*1000, r=rankAt(key,y);
      k += kpi(K.gdp(cname), fmtGdp(gd), `<i class="good">×${fx(gd/gv0,2)}</i>`);
      k += kpi(K.worldRank, r? K.rankN(r) : '—');
      k += kpi(K.perCap, Math.round(pc/100)*100+' $', `<i class="good">×${fx(pc/pc0,2)}</i>`);
      k += kpi(K.first, nameOf(topEconomies(y)[0]));
      let prev=rankAt(key,2026); for (let q=2027;q<=2050;q++){ const rr=rankAt(key,q); if (rr!==prev){ loc.push({y:q, t:M.rankMove(cname, rr, rr<prev), src:'PwC 2017', loc:1}); prev=rr; } }
      if (city && CP) k += kpi(K.shareCountry, F.pct(fx(cpAt(y)/pop/10,1)));
      if (city) k += kpi(K.role, city.t? K.roleHub : K.roleRegional);
      txt += city ? cityLine() : `<p>${ctyN(key)}</p>`;
    } else if (P.has){
      k += kpi(cname, K.noPwc);
      txt += `<p>${Sx.noPwc(cname)}</p>` + cityLine();
    }
    if (!gd){ const top=topEconomies(y); k += kpi(K.top3, top.slice(0,3).map(nameOf).join(', ')); k += kpi(K.rankOf(nameOf('792')), K.rankN(rankAt('792',y))); }
    glob = F.g.ekonomi(topEconomies(y).slice(0,3).map(nameOf).join(', '));
    loc.push(...worldMS('ekonomi'));
  }

  if (theme==='enerji'){
    if (P.has){
      const nz=nzOf(key), note=nzNoteOf(key);
      k += kpi(K.nzTarget(cname), nz? String(nz) : (note?K.uncertain:K.noTarget), nz? `<i class="${nz<=y?'good':'neu'}">${nz<=y?K.targetReached:K.yearsLeft(nz-y)}</i>`:'');
      k += kpi(K.targetStatus(y), !nz? '—' : nz<=y? K.atAfter : nz<=2050? K.within2050 : K.after2050);
      if (city){ k += kpi(K.coolDemand, F.lv[Math.min(3,lvlI(Math.max(city.h,0.01)))]); txt += cityLine(); }
      if (note) txt += `<p><b>${K.note}:</b> ${note}.</p>`;
      if (EU.includes(key)) txt += `<p>${Sx.eu(cname)}</p>`;
      if (nz) loc.push({y:Math.min(nz,2050), t: nz<=2050? M.nzYear(cname) : M.nzLater(cname, nz, nz-2050), src:'national target', loc:1});
    }
    k += kpi(K.renewWorld, F.pct(Math.round(g.R)), dlt(g0.R,g.R,' '+U.pts,0,true));
    { const cc=cityClim(city,y); if (cc) k += kpi(K.cooling(cn), F.lv[cc.W>=38?0:cc.W>=33?1:cc.W>=28?2:3], `<i class="up">${K.hottestShort} ${fx(cc.W,1)} °C</i>`); }
    k += kpi(K.evWorld, F.pct(Math.round(lerpT(EV[si],y))), y>2035?`<i class="neu">${K.trend2035}</i>`:'');
    if (city) txt += `<p>${Sx.ev3d(cn)}</p>`;
    glob = F.g.enerji(F.pct(Math.round(g.R)), scLong(si));
    loc.push(...worldMS('enerji'));
  }

  if (theme==='teknoloji'){
    if (city){
      const ci=CITIES.indexOf(city), links=ARC_PAIRS.filter(p=>p[0]===ci||p[1]===ci).map(p=>cN(CITIES[p[0]===ci?p[1]:p[0]]));
      k += kpi(K.techHub, city.t?K.yes:K.no);
      k += kpi(K.linked, links.length? K.nCities(links.length) : '—');
      txt += cityLine() + (links.length? `<p>${Sx.links(links.slice(0,8).join(', ')+(links.length>8?'…':''))}</p>`:'');
    } else if (P.has){
      const hubs=ccities.filter(c=>c.t);
      k += kpi(K.techHubs(cname), hubs.length? hubs.map(cN).join(', ') : K.notListed);
      txt += `<p>${Sx.noNetData}</p>`;
      if (cd) txt += `<p>${ctyN(key)}</p>`;
    }
    k += kpi(K.netWorld, F.pct(Math.round(g.I)), dlt(g0.I,g.I,' '+U.pts,0,true));
    k += kpi(K.offWorld, fmtBn(g.P*(1-g.I/100)));
    glob = F.g.tek(F.pct(Math.round(g.I)));
    loc.push(...worldMS('teknoloji'));
  }

  if (theme==='din'){
    if (P.has){
      k += kpi(cname, relName(relOf(key)) || '—');
      if (city) k += kpi(K.city, cn);
      if (REL_FACT_KEYS.includes(key)) { const rf=L.data.REL_FACT[key]; txt += `<p>${rf}</p>`; loc.push({y:2050, t:rf, src:'Pew 2015', loc:1}); }
      else if (EU.includes(key) || key==='826' || key==='578' || key==='756') { txt += `<p>${Sx.euRel}</p>`; loc.push({y:2050,t:M.euRel,src:'Pew 2015',loc:1}); }
      else txt += `<p>${Sx.noRel(cname)}</p>`;
    }
    k += `</div><div class="sub" style="margin:6px 0 0">${K.relDist(y)}</div><div class="rbar">${g.rel.map(r=>`<div style="width:${r.v}%;background:${r.c}"></div>`).join('')}</div><div class="rleg">${g.rel.map(r=>`<span><i style="background:${r.c}"></i>${relN(r.k)} ${F.pct(fx(r.v,1))}</span>`).join('')}</div><div class="kpis">`;
    glob = F.g.din(F.pct(fx(g.rel[1].v/g.rel[0].v*100,0)));
    txt += `<p class="note">${Sx.pew2025}</p>`;
    loc.push(...worldMS('din'));
  }

  if (theme==='kent'){
    if (city){
      k += kpi(K.coastFlood, lvl(city.r), city.r>0?`<i class="up">${K.seaPlus(cm(g.Sea))}</i>`:'');
      k += kpi(K.heatRisk, lvl(city.h), `<i class="up">+${fx(g.T*lf,1)} °C</i>`);
      k += kpi(K.cityPop(cn), CP? fmtMil(cpAt(y)/1000) : K.notInUN, CP? `<i class="${cpAt(y)>=cpAt(2026)?'up':'down'}">${fx((cpAt(y)/cpAt(2026)-1)*100,1)}%</i>`:'');
      if (sub) k += kpi(K.subsidence, K.yes);
      { const cc=cityClim(city,y); if (cc) { k += kpi(K.hottestShort2, fx(cc.W,1)+' °C'); k += kpi(K.twin, twin(cc.d.an)); } }
      txt += cityLine();
    } else if (P.has){
      k += kpi(K.listedCities(cname), ccities.length? ccities.map(cN).join(', ') : K.none);
      const risky = ccities.filter(c=>c.r>=.6||c.h>=.85);
      k += kpi(K.riskCities, risky.length? risky.map(cN).join(', ') : (ccities.length?K.notMarked:'—'));
      if (cd) txt += `<p>${ctyN(key)}</p>`;
    }
    k += kpi(K.urbanWorld, F.pct(fx(g.U,1)), dlt(g0.U,g.U,' '+U.pts,1));
    glob = F.g.kent(F.pct(fx(g.U,1)), fx(g.P*g.U/100,2));
    loc.push(...worldMS('kent'));
  }

  txt = yearText(theme, y, P) + txt;
  // scenario-dependent computed milestones
  { const fy=f=>firstYear(f), W=F.worldPfx;
    if (theme==='nufus'){ [2030,2050].forEach(q=>loc.push({y:q,t:W+M.popAt(fx(G(q).P,2), fx(G(q).L,1), sN),src:'UN WPP 2024 + SSP'})); const a=fy(q=>G(q).P>=9.0); loc.push(a?{y:a,t:W+M.pop9(sN),src:'UN + SSP'}:{y:2050,t:W+M.noPop9(sN),src:'UN + SSP'}); }
    if (theme==='enerji'){ const a=fy(q=>G(q).R>=50), b=fy(q=>lerpT(EV[si],q)>=50); if(a) loc.push({y:a,t:W+M.ren50(sN),src:'IEA scenarios'}); if(b) loc.push({y:b,t:W+M.ev50(sN),src:'IEA + ARC trend'}); }
    if (theme==='teknoloji'){ const a=fy(q=>G(q).I>=90); if(a) loc.push({y:a,t:W+M.net90(sN),src:'ITU + trend'}); }
    if (theme==='kent'){ const a=fy(q=>G(q).U>=70); if(a) loc.push({y:a,t:W+M.urb70(sN),src:'UN + SSP'}); }
  }
  const h = `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="phase">${phN(ph)}</span><span class="phase" style="background:rgba(92,242,214,.1);color:var(--acc);border-color:rgba(92,242,214,.3)">${scope}</span></div>
    <div class="kpis">${k}</div>${txt}
    <div class="sub" style="margin-top:12px">🌍 ${F.worldWide} · ${glob}</div><p>${nar}</p>
    <div class="sub" style="margin-top:10px">${K.msHeader(y)}</div>${msList(loc,y)}`;
  return { html:h, place:P.place, sub: P.level==='city' ? cname : '' };
}

// ---- year-specific explanatory paragraph for the selected place & theme ----
function yearText(theme, y, P){
  const { city, key, cd, cname } = P, g=G(y), g0=G(2026), si=state.scen, sN=scName(si), F=L.f;
  const place = P.place, yy = Math.round(y), cn = city ? cN(city) : null;
  const CP = city ? CPOP[city.n] : null, cpAt = q => CP ? cityPop(city.n, q) : null;
  const sg = v => (v>=0?'+':'');
  let t = '';
  if (theme==='iklim'){
    const cc = cityClim(city, y), cc0 = cityClim(city, 2026), cc50 = cityClim(city, 2050);
    const o = { yy, place, sN, T:fx(g.T,2), sea:Math.round(g.Sea*100), co2:Math.round(g.C), has:P.has };
    if (cc){
      const W = cc.W, pr = cc50.k>cc0.k ? Math.round((cc.k-cc0.k)/(cc50.k-cc0.k)*100) : 0;
      o.cc = { T:fx(cc.T,1), d0:fx(cc.T-cc.d.T0,1), d26:sg(cc.T-cc0.T)+fx(cc.T-cc0.T,1), W:fx(W,1), heat: W>=45?0:W>=40?1:W>=35?2:W>=30?3:4,
               P:Math.round(cc.P), dP:sg(cc.P-cc0.P)+Math.round(cc.P-cc0.P), an:twin(cc.d.an), prog:Math.max(0,Math.min(100,pr)), final: yy>=2050 };
    } else if (P.has){ const lt=g.T*P.lf; o.lt=fx(lt,1); o.lt26=fx(lt-g0.T*P.lf,1); }
    if (city && city.r>0) o.coast = { lvl:lvlLow(city.r), d:Math.round((g.Sea-g0.Sea)*100), subs:SUBSIDE.includes(city.n) };
    t = F.yt.iklim(o);
  }
  if (theme==='nufus'){
    const o = { yy, P:fx(g.P,2), L:fx(g.L,1) };
    if (CP){ const n=cpAt(y), n0=cpAt(2026); o.cp = { name:cn, n:fx(n/1000,1), d:sg(n-n0)+fx((n-n0)/1000,2), per: yy>2026 ? sg(n-n0)+Math.round((n-n0)/Math.max(1,yy-2026)) : null }; }
    if (cd){ const p=popAt(cd.p,y), p0=popAt(cd.p,2026); o.cty = { name:cname, p:fmtPop(p), ch:sg(p-p0)+fx((p/p0-1)*100,1), decline: popAt(cd.p,2050)<popAt(cd.p,2026) }; }
    t = F.yt.nufus(o);
  }
  if (theme==='ekonomi'){
    const gd = cd ? gdpAt(cd.g,y) : null;
    const o = { yy, sN, cname, key };
    if (gd){ const pc=gd/popAt(cd.p,y)*1000, g0v=gdpAt(cd.g,2026);
      o.gd = { r:rankAt(key,y), gdp:fmtGdp(gd), x:fx(gd/g0v,2), pc:Math.round(pc/100)*100 };
      if (city && CP) o.city = { name:cn, share:fx(cpAt(y)/popAt(cd.p,y)/10,1), hub:!!city.t };
    } else o.top3 = topEconomies(y).slice(0,3).map(nameOf).join(', ');
    t = F.yt.ekonomi(o);
  }
  if (theme==='enerji'){
    const o = { yy, R:Math.round(g.R), ev:Math.round(lerpT(EV[si],y)), s:si };
    if (P.has){ const nz=nzOf(key); o.cty = { name:cname, nz, left: nz? nz-yy : null, reached: nz && nz<=y }; }
    if (city){ const cc=cityClim(city,y); if (cc) o.city = { name:cn, W:fx(cc.W,1), lv: cc.W>=38?0:cc.W>=33?1:2 }; }
    t = F.yt.enerji(o);
  }
  if (theme==='teknoloji'){
    t = F.yt.tek({ yy, I:Math.round(g.I), off:fx(g.P*(1-g.I/100),2), city: city ? { name:cn, hub:!!city.t } : null });
  }
  if (theme==='din'){
    const r=g.rel;
    t = F.yt.din({ yy, sN, chr:fx(r[0].v,1), mus:fx(r[1].v,1), non:fx(r[2].v,1), hin:fx(r[3].v,1), ratio:fx(r[1].v/r[0].v*100,0), cty: P.has ? { name:cname, rel: relName(relOf(key))||'—' } : null });
  }
  if (theme==='kent'){
    let c=null; if (city){ const cc=cityClim(city,y); c = { name:cn, pop: CP? fx(cpAt(y)/1000,1) : null, coast:lvlLow(city.r), heat:lvlLow(city.h), W: cc? fx(cc.W,1) : null }; }
    t = F.yt.kent({ yy, U:fx(g.U,1), people:fx(g.P*g.U/100,2), city:c });
  }
  return t ? `<p class="yeartxt">${t}</p>` : '';
}

function topEconomies(y){ return Object.keys(C).filter(k=>gdpAt(C[k].g,y)).sort((a,b)=>gdpAt(C[b].g,y)-gdpAt(C[a].g,y)); }
function rankAt(key,y){
  const R = {'156':[1,1,1],'840':[2,2,3],'356':[3,3,2],'392':[4,4,8],'276':[5,7,9],'643':[6,6,6],'076':[7,8,5],'360':[8,5,4],'826':[9,10,10],'250':[10,11,12],'484':[11,9,7],'380':[12,15,21],'410':[13,14,18],'792':[14,12,11],'682':[15,13,13],'124':[17,18,22],'364':[18,16,17],'764':[20,22,25],'818':[21,19,15],'566':[22,21,14],'586':[24,20,16],'050':[31,null,23]}[key];
  if (!R) return null; const pts=[[2016,R[0]],[2030,R[1]],[2050,R[2]]].filter(p=>p[1]!=null); return Math.round(lerpT(pts,y));
}

const pageEl=$('#page');
const pageOpen = () => pageEl.classList.contains('show');
function themeVars(k){ const [a,b]=PLANET_COL[k]; return `--pc:${a};--pc2:${b}`; }

     <div class="seg" id="cScen">${SCEN.map((s,i)=>`<button data-s="${i}" class="${i===state.scen?'on':''}">${scShort(i)}</button>`).join('')}</div>
   </section>
   <section class="pg-place"><h2>${b.place} · ${y}</h2><div class="sub">${b.sub? b.sub+' · ':''}${scLong(state.scen)} · ${UI.vs2026}</div></section>
   ${b.html}
   <div class="note">${UI.disclaimer}</div>
  </div></div>
  <div class="pg-foot"><button class="nav" id="pgPrev" aria-label="prev">‹</button><button class="cta" id="bShow">${UI.showOnGlobe}</button><button class="nav" id="pgNext" aria-label="next">›</button></div>`;
  pageEl.querySelector('.pg-scroll').scrollTop = keepScroll;

  $('#pgNext').onclick=()=>go(THEMES[(i+1)%THEMES.length].k);
  $('#pgBack').onclick=closePage;
  $('#pgInfo').onclick=()=>renderInfo();
  $('#bShow').onclick=()=>{ closePage(); if (state.cardTab && state.cardTab!==state.theme) setTheme(state.cardTab); showChange(); };

function openPage(k){ state.cardTab = k || state.theme; if (k && k!==state.theme) setTheme(k); renderBrief(); pageEl.classList.add('show'); pageEl.querySelector('.pg-scroll').scrollTop=0; }
function closePage(){ pageEl.classList.remove('show'); }
PLANETS.forEach(P=>{ P.el.onclick=()=>openPage(P.k); P.el.onpointerenter=()=>orbitHover=true; P.el.onpointerleave=()=>orbitHover=false; });
$('#layerBtn').onclick=()=>openPage(state.theme);
$('#go').onclick=()=>openPage(state.theme);
modal.onclick=e=>{ if (e.target===modal) modal.classList.remove('show'); };

function renderInfo(){
  card.dataset.kind='info';
  card.innerHTML=`<h2>${L.f.info.title}</h2><div class="sub">${L.f.info.sub}</div>
  <ul class="src">${L.f.info.items.map(([h,t])=>`<li><b>${h}:</b> ${t}</li>`).join('')}</ul>
  <p><a href="https://www.ipcc.ch/report/ar6/wg1/" target="_blank" rel="noopener">IPCC</a> · <a href="https://population.un.org/wpp/" target="_blank" rel="noopener">UN WPP</a> · <a href="https://www.iea.org/reports/world-energy-outlook-2025" target="_blank" rel="noopener">IEA</a> · <a href="https://www.pwc.com/gx/en/research-insights/economy/the-world-in-2050.html" target="_blank" rel="noopener">PwC</a> · <a href="https://www.pewresearch.org/religion/2015/04/02/religious-projections-2010-2050/" target="_blank" rel="noopener">Pew</a> · <a href="https://www.itu.int/itu-d/reports/statistics/facts-figures-2025/" target="_blank" rel="noopener">ITU</a></p>
  <div class="credit"><div class="cr-name">World Projection</div><div class="cr-by">${L.f.ui.madeBy}</div><div class="cr-arc">ARC Studios</div><div class="cr-who">Emre Arıcı</div><div class="cr-tag">${L.f.ui.studioTag}</div><a href="https://arcstudios.com.tr" target="_blank" rel="noopener">arcstudios.com.tr</a></div>
  <div class="note">${L.f.info.map}</div>
  <div class="btns"><button class="cta" id="bClose">${L.f.ui.ok}</button></div>`;
  modal.classList.add('show'); $('#bClose').onclick=()=>modal.classList.remove('show');
}
$('#info').onclick=renderInfo;

/* ---------------- language switching ---------------- */
function applyStatic(){
  const UI=L.f.ui;
  document.documentElement.lang = LG;
  $('#tagline').textContent = UI.tagline;
  $('#lblYear').textContent = UI.year; $('#lblScen').textContent = UI.scenario;
  document.querySelectorAll('#scen button').forEach(b=>b.textContent=scShort(+b.dataset.s));
  $('#go').textContent = UI.brief;
  $('#modeBtn').textContent = (typeof mode!=='undefined' && mode==='city') ? UI.toGlobe : UI.city3d;
  $('#cityNote').textContent = UI.cityNote;
  $('#selLang').innerHTML = LANGS.map(l=>`<option value="${l}">${I18N[l].flag} ${I18N[l].name}</option>`).join(''); $('#selLang').value = LG;
}
function setLang(l){
  if (!LANGS.includes(l)) return;
  LG = l; L = I18N[l]; try { localStorage.setItem('wp25_lang', l); } catch(e){}
  applyStatic(); renderThemes(); fillCountries(); fillCities(); renderLegend(); renderHUD(state.shownYear); updateCityTag(state.shownYear);
  if (pageOpen()) renderBrief();
  if (modal.classList.contains('show') && card.dataset.kind==='info') renderInfo();
  if (window.__splashLang) window.__splashLang();
}
window.setLang = setLang;
$('#selLang').onchange = e => setLang(e.target.value);
applyStatic();

/* ---------------- camera + animation ---------------- */
let fly=null, yearAnim=null;
function flyTo([lat,lon], dist){ controls.autoRotate=false; const from=camera.position.clone(); fly={ from:from.clone().normalize(), to:toVec(lat,lon,1).normalize(), d0:from.length(), d1:dist, start:performance.now() }; }
function placeBeacon(ll){ if(!ll){ beacon.visible=false; return; } const v=toVec(ll[0],ll[1],1.004); beacon.position.copy(v); beacon.quaternion.setFromUnitVectors(Z, v.clone().normalize()); beacon.visible=true; }
function showChange(){
  const city = state.city!=='' ? CITIES[+state.city] : null, f = state.country ? FEAT[state.country] : null;
  if (city){ if (mode!=='city') enterCity(state.city); } else if (f) flyTo(f.center,idealDist()); else controls.autoRotate=true;
  yearAnim={ a:2026, b:state.year, dur:4.5, start:performance.now() };
  toast(`2026 → ${state.year} · ${THEMES.find(t=>t.k===state.theme).n} · ${scName(state.scen)}`);
}
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',1800); }

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let downXY=null;
canvas.addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; controls.autoRotate=false; cityControls.autoRotate=false; });
canvas.addEventListener('pointerup', e=>{
  if (mode==='city' || !downXY || Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1])>6) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObject(earth)[0]; if(!hit) return;
  const p=hit.point.clone().normalize(), lat=Math.asin(p.y)/DEG; let lon=Math.atan2(p.z,-p.x)/DEG-180; if(lon<-180) lon+=360;
  let bi=-1, bd=2.2; CITIES.forEach((c,i)=>{ const d=Math.hypot(c.a-lat,(c.o-lon)*Math.cos(lat*DEG)); if(d<bd){bd=d;bi=i;} });
  if (bi>=0){ setCity(bi,false); toast(cN(CITIES[bi])); return; }
  const f=countryAt(lat,lon); if (f){ setCountry(f.key,false); toast(nameOf(f.key)); }
});
addEventListener('resize', ()=>{ camera.aspect=cityCam.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); cityCam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); layoutOrbit(); });
layoutOrbit(); setTimeout(layoutOrbit, 300); $('#collapse').addEventListener('click', ()=>setTimeout(layoutOrbit, 30));

/* ---------------- loop ---------------- */
const timer = new THREE.Timer(); timer.connect(document);
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
setCountry('792', false); setTheme('iklim'); state.shownYear=2026; applyYear(2026);
flyTo(FEAT['792'].center, idealDist());

let cityErr = 0;
function showErr(err){
  let box = document.getElementById('errBox');
  if (!box){ box=document.createElement('div'); box.id='errBox'; box.style.cssText='position:fixed;left:8px;right:8px;top:40%;z-index:50;background:#3a0d12;color:#ffd7d7;font:11px/1.4 monospace;padding:10px;border-radius:10px;white-space:pre-wrap;max-height:30vh;overflow:auto'; box.onclick=()=>box.remove(); document.body.appendChild(box); }
  box.textContent = L.f.ui.errTitle+'\n' + (err && (err.message || err)) + '\n' + ((err && err.stack) || '').split('\n').slice(0,4).join('\n');
}
renderer.setAnimationLoop(()=>{
  timer.update(); const t=timer.getElapsed(), now=performance.now();
  if (fly){ const k=ease(Math.min(1,(now-fly.start)/1600)); camera.position.copy(fly.from.clone().lerp(fly.to,k).normalize().multiplyScalar(fly.d0+(fly.d1-fly.d0)*k)); if (k>=1) fly=null; }
  if (yearAnim){ const k=Math.min(1,(now-yearAnim.start)/1000/yearAnim.dur); const y=yearAnim.a+(yearAnim.b-yearAnim.a)*ease(k); state.shownYear=y; applyYear(y); if(k>=1) yearAnim=null; }
  if (beacon.visible){ const s=1+0.25*Math.sin(t*4); beacon.scale.set(s,s,s); }
  if (mode!=='city' && state.city!==''){
    const c=CITIES[+state.city], el=$('#cityTag'), v=c.v.clone();
    const facing = v.clone().normalize().dot(camera.position.clone().normalize()) > 0.15;
    v.project(camera);
    if (facing){ el.style.display='block'; el.style.left=((v.x+1)/2*innerWidth)+'px'; el.style.top=((1-v.y)/2*innerHeight)+'px'; } else el.style.display='none';
  }
  if (mode==='city'){
    try {
      if (cars.count) renderer.compute(tUpdate);
      cityControls.update(); cityFrame(now); cityPipeline.render();
      cityErr = 0;
    } catch(err){
      cityErr++; showErr(err);
      if (cityErr>=3){ exitCity(); toast(L.f.ui.city3dFail); }
    }
  } else {
    updateCities(t); updateArcs(t); updatePlanets(Math.min(0.05, timer.getDelta()));
    if (particles.visible) renderer.compute(pUpdate);
    controls.update(); pipeline.render();
  }
});
window.__appReady && window.__appReady();
</script>
</body>
</html>
